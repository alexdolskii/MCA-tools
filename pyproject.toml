[build-system]
requires = ["setuptools>=77,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mca-tools"
version = "0.2.4"
description = "LIF export and SHG image analysis for the Multimodal Collagen Analysis Toolkit."
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy==1.26.4",
    "pandas>=2.1,<3",
    "pillow>=10.1,<13",
    "pyimagej==1.5.0",
    # readlif 0.6.6 requires NumPy 2, unlike the FIA/UMA NumPy 1.26 baseline.
    "readlif==0.6.5",
    "scyjava==1.10.0",
    "jgo==1.0.4",
    # Last tifffile release supporting the shared Python 3.10 baseline.
    "tifffile==2025.5.10",
    "psutil>=5.9,<8",
]

[project.scripts]
shg1_lif_to_tif = "mca_tools.cli:lif_export"
shg2_intden_assay = "mca_tools.cli:shg_analysis"

[project.urls]
Repository = "https://github.com/alexdolskii/MCA-tools"
Issues = "https://github.com/alexdolskii/MCA-tools/issues"

[tool.setuptools.package-dir]
"" = "code"

[tool.setuptools.packages.find]
where = ["code"]
include = ["mca_tools"]
namespaces = false

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
target-version = "py310"
line-length = 79
src = ["code"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
# JPype needs the JVM's fault handlers through interpreter shutdown.
# Restoring pytest's Python handlers can segfault after all tests pass.
addopts = "-p no:faulthandler"
testpaths = ["tests"]
markers = ["imagej: native ImageJ integration (set MCA_RUN_IMAGEJ_TESTS=1)"]
