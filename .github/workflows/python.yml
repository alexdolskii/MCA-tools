name: MCA Python checks

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'code/**'
      - '!code/**/*.md'
      - 'tests/**'
      - 'environment.yaml'
      - 'pyproject.toml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'code/**'
      - '!code/**/*.md'
      - 'tests/**'
      - 'environment.yaml'
      - 'pyproject.toml'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      full:
        description: 'Run both test suites on Linux and macOS before a release'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      full: ${{ steps.scope.outputs.full }}
      imagej_os: ${{ steps.scope.outputs.imagej_os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select the required platform coverage
        id: scope
        env:
          FULL_REQUESTED: ${{ inputs.full || false }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          full = (
              os.environ['FULL_REQUESTED'] == 'true'
              or os.environ['GITHUB_REF'].startswith('refs/tags/')
          )
          if not full and os.environ['GITHUB_EVENT_NAME'] != 'workflow_dispatch':
              pr = event.get('pull_request')
              base = pr['base']['sha'] if pr else event.get('before')
              if not base or set(base) == {'0'}:
                  full = True
              else:
                  head = pr['head']['sha'] if pr else os.environ['GITHUB_SHA']
                  revision = f'{base}...{head}' if pr else f'{base}..{head}'
                  changed = subprocess.check_output(
                      ['git', 'diff', '--name-only', '-z', revision], text=True
                  ).split('\0')
                  environment_files = {
                      'environment.yaml', 'pyproject.toml',
                      'code/mca_tools/fiji_config.py',
                      'code/mca_tools/imagej.py',
                      'code/mca_tools/runtime.py',
                  }
                  full = any(
                      path in environment_files
                      or path.startswith('.github/workflows/')
                      for path in changed
                  )
          platforms = ['ubuntu-latest', 'macos-latest'] if full else ['macos-latest']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'full={str(full).lower()}\n')
              output.write(f'imagej_os={json.dumps(platforms)}\n')
          print(f'Full platform coverage: {full}; Fiji platforms: {platforms}')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install package and check dependencies
        run: |
          python -m pip install '.[dev]'
          python -m pip check
          shg1_lif_to_tif --help
          shg2_intden_assay --version
      - name: Check style
        run: |
          ruff check code tests
          ruff format --check code tests
      - name: Test export, calibration, selection and command resources
        run: python -m pytest -q -m 'not imagej'

  python-macos:
    needs: python
    if: needs.python.outputs.full == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install package and check dependencies
        run: |
          python -m pip install '.[dev]'
          python -m pip check
          shg1_lif_to_tif --help
          shg2_intden_assay --version
      - name: Test export, calibration, selection and command resources
        run: python -m pytest -q -m 'not imagej'

  imagej:
    needs: python
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.python.outputs.imagej_os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: false
          activate-environment: mca_tools
          environment-file: environment.yaml
      - name: Install MCA and check the declared environment
        run: |
          python -m pip install '.[dev]'
          python -m pip check
          java -version
          mvn -version
      - name: Check native Fiji measurements and metadata
        env:
          MCA_RUN_IMAGEJ_TESTS: '1'
        run: python -m pytest -q tests/test_imagej.py
